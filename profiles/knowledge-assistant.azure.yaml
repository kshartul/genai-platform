# Same use case on Azure: Azure OpenAI + Azure AI Search + Cosmos DB/Neo4j + Content Safety.
name: knowledge-assistant
corpus_paths: [data/sample_corpus]

models:
  provider: azure
  endpoint: ${AZURE_OPENAI_ENDPOINT}
  api_version: "2024-10-21"
  chat_model: ${AZURE_OPENAI_CHAT_DEPLOYMENT}
  fallback_models: [${AZURE_OPENAI_FALLBACK_DEPLOYMENT}]
  embedding_model: ${AZURE_OPENAI_EMBED_DEPLOYMENT}
  embedding_dim: 1536

chunking: {strategy: parent_child, target_tokens: 600, child_tokens: 150, contextual_headers: true, redact_pii: true}

vectorstore:
  kind: azure_search
  endpoint: ${AZURE_SEARCH_ENDPOINT}
  index: kb-aoai-1536-v1

retrieval: {mode: hybrid+graph, top_k: 30, rerank_top_n: 6, reranker: azure_semantic, query_rewrite: true, corrective: true}

guardrails:
  provider: azure_content_safety
  min_groundedness: 0.7

kg: {enabled: true, ontology_path: ontology/enterprise.yaml, store: neo4j, uri: "${NEO4J_URI}"}

agent: {pattern: react, max_steps: 8, max_cost_usd: 0.50}

evals:
  golden_set: evals/golden/knowledge-assistant.jsonl
  thresholds: {"hit_rate@5": 0.80, context_recall: 0.80, faithfulness: 0.85, refusal_accuracy: 1.0, acl_leakage_free: 1.0,
               agent_tool_accuracy: 0.80, latency_p95_ms: 2500}

prompts:
  warehouse_path: data/warehouse/analytics.db
