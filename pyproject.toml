[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-platform"
version = "0.1.0"
description = "Reusable enterprise GenAI platform: RAG, agents, knowledge graph, MCP, guardrails and evaluation on AWS and Azure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "langgraph>=0.2",
  "mcp>=2.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34", "opensearch-py>=2.5", "requests-aws4auth>=1.2", "neo4j>=5.18"]
azure = ["openai>=1.30", "azure-search-documents>=11.4", "azure-identity>=1.16", "azure-ai-contentsafety>=1.0"]
parsing = ["pypdf>=4.0", "python-docx>=1.1", "beautifulsoup4>=4.12"]
evals = ["ragas>=0.2", "deepeval>=1.0"]
observability = ["langfuse>=2.0", "opentelemetry-sdk>=1.24"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
genai = "genai_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"
